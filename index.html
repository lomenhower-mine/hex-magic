<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voidfall — Zombie Survival</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #080611;
      color: #f4efff;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(ellipse at center, #211138cc, #080611ee 72%);
    }
    #card {
      width: min(500px, calc(100vw - 32px));
      padding: 30px;
      border: 1px solid #b45cff88;
      border-radius: 20px;
      background: #100b1dea;
      box-shadow: 0 0 55px #8b36ff44;
    }
    h1 {
      margin: 0 0 8px;
      color: #e2c5ff;
      letter-spacing: .12em;
      text-shadow: 0 0 22px #ac51ff;
    }
    p { color: #c8bbd8; line-height: 1.55; }
    button {
      color: white;
      border: 1px solid #d9b4ff88;
      border-radius: 10px;
      background: linear-gradient(135deg, #8a3de0, #5421a0);
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 18px #812eff55;
    }
    button:hover { filter: brightness(1.2); }
    #hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    #top {
      display: flex;
      justify-content: space-between;
      padding: 16px;
      color: #eadcff;
      text-shadow: 0 2px 8px #000;
    }
    #wave { font-size: 20px; font-weight: 700; }
    #stats { text-align: right; line-height: 1.65; }
    #message {
      position: absolute;
      top: 23%;
      width: 100%;
      text-align: center;
      font-size: clamp(28px, 6vw, 64px);
      font-weight: 800;
      color: #f3d8ff;
      text-shadow: 0 0 24px #a03dff;
    }
    #crosshair {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 25px;
      color: #dffaff;
      text-shadow: 0 0 10px #50eaff;
    }
    #bottom {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    #weapon {
      padding: 9px 14px;
      border: 1px solid #9d73bf88;
      border-radius: 9px;
      background: #120d20dd;
    }
    #upgrade {
      pointer-events: auto;
    }
    #hint {
      position: absolute;
      bottom: 14px;
      right: 16px;
      color: #c7b9d7;
      font-size: 12px;
      text-align: right;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="card">
      <h1>VOIDFALL</h1>
      <p id="intro">
        Зомби идут из разлома. Собирай монеты, улучшай оружие
        и переживи все 20 волн.
      </p>
      <p>WASD — движение · мышь — обзор · Space — прыжок<br>
        ЛКМ — стрелять · 1/2 — пистолет/меч</p>
      <button id="join">Вступить в зомби-апокалипсис</button>
    </div>
  </div>

  <div id="hud">
    <div id="top">
      <div id="wave">Ожидание игроков</div>
      <div id="stats">❤️ 100<br>✦ 50 монет<br>Оружие I уровня</div>
    </div>
    <div id="message"></div>
    <div id="crosshair">+</div>
    <div id="bottom">
      <div id="weapon">1 — Магический пистолет</div>
      <button id="upgrade">Улучшить оружие</button>
    </div>
    <div id="hint">WASD — ходить<br>Space — прыжок<br>ЛКМ — атака</div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
